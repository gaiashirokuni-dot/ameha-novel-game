<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090c">
  <title>あなたが今日、出会うのは。｜体験ノベル V5</title>
  <meta name="description" content="背景・立ち絵・イベントCGを使ったマルチエンディング型の短編ノベルゲームです。">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="game" class="game-shell">
    <!-- 背景レイヤー -->
    <div id="backdrop" class="backdrop"></div>

    <!-- 立ち絵レイヤー -->
    <div id="standingLayer" class="standing-layer" hidden>
      <img id="standingImage" class="standing-image" alt="">
    </div>

    <!-- 画面演出 -->
    <div id="shade" class="screen-shade"></div>
    <div id="flash" class="flash"></div>
    <div id="systemAlert" class="system-alert"></div>

    <header class="topbar">
      <div id="brand" class="brand">THERAPIST STORY</div>
      <div class="top-actions">
        <div id="gorillaMeter" class="gorilla-meter" hidden>GORILLA LEVEL 0%</div>
        <button id="collectionBtn" class="ghost-btn" type="button">END一覧</button>
        <button id="homeBtn" class="ghost-btn" type="button" hidden>最初から</button>
      </div>
    </header>

    <main id="stage" class="stage" aria-live="polite"></main>

    <div class="prototype-tag">PROTOTYPE V5 / STANDING SPRITE MODE</div>
  </div>

  <!--
    文章とシステムを分離しています。

    content/text.js
      → セリフ・質問・選択肢だけ。自由に変更OK。

    config/game-config.js
      → 判定ポイント・END画像など。

    config/scene-config.js
      → 背景・立ち絵の指定。

    js/game.js
      → ゲーム本体。基本触らない。
  -->
  <script src="./content/text.js"></script>
  <script src="./config/game-config.js"></script>
  <script src="./config/scene-config.js"></script>
  <script src="./js/game.js"></script>
</body>
</html>
