<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090c">
  <title>あなたが今日、出会うのは。｜体験ノベル V4</title>
  <meta name="description" content="選択肢によって出会うセラピストと過ごし方が変わる、マルチエンディング型の短編ノベルゲームです。">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="game" class="game-shell">
    <div id="backdrop" class="backdrop"></div>
    <div id="shade" class="screen-shade"></div>
    <div id="flash" class="flash"></div>
    <div id="systemAlert" class="system-alert"></div>

    <header class="topbar">
      <div id="brand" class="brand">THERAPIST STORY</div>
      <div class="top-actions">
        <div id="gorillaMeter" class="gorilla-meter" hidden>GORILLA LEVEL 0%</div>
        <button id="collectionBtn" class="ghost-btn" type="button">END一覧</button>
        <button id="homeBtn" class="ghost-btn" type="button" hidden>最初から</button>
      </div>
    </header>

    <main id="stage" class="stage" aria-live="polite"></main>

    <div class="prototype-tag">PROTOTYPE V4 / 7 ENDINGS</div>
  </div>

  <!--
    読み込み順は重要です。
    1. text.js       = 文章だけ（自由に編集OK）
    2. game-config.js = 判定・画像・URL（基本触らない）
    3. game.js       = ゲームシステム（触らない）
  -->
  <script src="./content/text.js"></script>
  <script src="./config/game-config.js"></script>
  <script src="./js/game.js"></script>
</body>
</html>
